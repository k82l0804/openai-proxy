services:
  llm-proxy:
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "8000", "--host", "0.0.0.0"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health/liveliness"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
