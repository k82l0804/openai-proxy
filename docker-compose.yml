services:
  llm-proxy:
    image: ghcr.io/berriai/litellm:main-stable
    ports:
      - "8000:8000"
    env_file:
      - .env
    # :z relabels the files for SELinux (enforcing on RHEL/OL/Fedora); a no-op where SELinux is off.
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro,z
      - ./agy_callbacks.py:/app/agy_callbacks.py:ro,z
    command: ["--config", "/app/config.yaml", "--port", "8000", "--host", "0.0.0.0"]
    restart: unless-stopped
    healthcheck:
      # python, not curl: the litellm image (Wolfi-based) has no curl. No spaces inside an argument: Podman's
      # Docker-compatible API splits healthcheck arguments on spaces.
      test: ["CMD", "python3", "-c", "__import__('urllib.request').request.urlopen('http://localhost:8000/health/liveliness',timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
