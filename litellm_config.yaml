      supports_tools: true
      supports_json_mode: true

  # --- effort variants (WT-0e): the effort is fixed by the model name, so every client (Grok CLI, wingman-ts) gets the same setting
  - model_name: or-grok-4.7-high
    litellm_params:
      model: openrouter/x-ai/grok-4.7
      api_key: os.environ/OPEN_ROUTER_API_KEY
      # OpenRouter's native reasoning control; LiteLLM drops the OpenAI-style reasoning_effort for openrouter (verified 2026-10-17)
      extra_body:
        reasoning:
          effort: high
    model_info:
      fox_tier: S
      context_k: 500
      max_output_k: 131
      supports_tools: true
      supports_json_mode: true

