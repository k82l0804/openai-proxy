# LiteLLM Proxy Configuration
#
# Exposes models under OpenAI-compatible model names.
# The Fox CLI and ACP client use standard OpenAI SDK calls against
# http://localhost:8000 — they have no knowledge of Google / OpenRouter APIs.
#
# Capability Tiers (S > A > B > C > D):
#   S — Frontier (70B+): unlimited agentic steps, full tool-call editing
#   A — Fast reasoning (30-40B): unlimited steps, full tool-call editing
#   B — Benchmark (13-20B): 5 steps, tool-call editing
#   C — Summarization (7-10B): 3 steps, fence-parse editing
#   D — Basic chat (<7B): 1 step, whole-file rewrite
#
# Higher tiers can substitute for lower tiers (S can do C's job, not vice versa).
#
# model_info fields (declared capabilities, validated against tier spec):
#   tier              — Capability tier (S/A/B/C/D)
#   params_b          — Total parameter count in billions (omit if unknown)
#   params_estimated  — true if params_b is an unofficial estimate
#   context_k         — Context window in thousands of tokens
#   max_output_k      — Max output tokens per turn in thousands
#   supports_tools    — Supports OpenAI-style function/tool calling
#   supports_json_mode — Supports structured JSON output (response_format)
#
# Canonical spec: docs/specs/2026-09-26T13-53_tier-capability-spec.yaml
#   Spec defines tier requirements → model_info declares compliance → tier-sync validates
#
# Model mapping:
#   gpt-4o-mini           →  openrouter/openai/gpt-4o-mini               (Tier B — override)
#   gpt-4o                →  openrouter/google/gemini-3.1-pro-preview     (Tier S)
#   gemini-3.6-flash      →  gemini/gemini-3.6-flash                      (Tier S)
#   nemotron-3-ultra      →  openrouter/nvidia/nemotron-3-ultra-550b-a55b (Tier S)
#   gemma-4               →  openrouter/google/gemma-4-31b-it:free        (Tier A)
#   gpt-oss               →  openrouter/openai/gpt-oss-120b               (Tier S)
#   codestral             →  openrouter/mistralai/codestral-2508           (Tier A)
#   llama-3.2-3b          →  openrouter/meta-llama/llama-3.2-3b-instruct  (Tier D)
#   llama-3.1-8b          →  openrouter/meta-llama/llama-3.1-8b-instruct  (Tier C)
#   qwen-2.5-7b-instruct  →  openrouter/qwen/qwen-2.5-7b-instruct        (Tier C)
#   llama-3.3             →  openrouter/meta-llama/llama-3.3-70b-instruct (Tier S)
#   qwen-2.5-coder-32b    →  openrouter/qwen/qwen-2.5-coder-32b-instruct  (Tier B)
#   grok-4.7              →  xai/grok-4.7                                  (Tier S)
#   deepseek-v4-flash     →  openrouter/deepseek/deepseek-v4-flash-0731   (Tier A)

model_list:
  - model_name: gpt-4o-mini
    litellm_params:
      model: openrouter/openai/gpt-4o-mini
      api_key: os.environ/OPEN_ROUTER_API_KEY
    model_info:
      fox_tier: B
      fox_tier_override_reason: "8B params (Tier C by size) promoted to Tier B — supports tools, JSON mode, 128K context"
      params_b: 8
      params_estimated: true
      context_k: 128
      max_output_k: 16
      supports_tools: true
      supports_json_mode: true

